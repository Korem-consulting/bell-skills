# Generated from an upstream source; changes made here are overwritten by the next sync.
# Content arrives from upstream as a sync/* branch; open a pull request for it.
name: Sync PR

on:
  push:
    branches: ["sync/**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number -q '.[].number')" ]; then
            echo "PR already open for $BRANCH"; exit 0
          fi
          gh pr create --base main --head "$BRANCH" \
            --title "Sync skills ($BRANCH)" \
            --body "Automated sync from upstream. CI fails if the skills changed without a version bump in plugin.json."
